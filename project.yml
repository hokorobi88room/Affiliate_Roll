name: Nexus
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # ← 自分のPersonal Teamに書き換え(Xcodeが自動設定でも可)
    CODE_SIGN_STYLE: Automatic

targets:
  Nexus:
    type: application
    platform: iOS
    sources:
      - Nexus
    dependencies:
      - target: NexusWidgets
        embed: true
    info:
      path: Nexus/Info.plist
      properties:
        CFBundleDisplayName: Nexus
        UILaunchScreen: {}
        UIBackgroundModes: [audio, processing]
        NSUserNotificationsUsageDescription: "リマインダーと習慣通知に使用します"
        NSFaceIDUsageDescription: "アプリロック解除に使用します"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Nexus/Nexus.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.nexus
        TARGETED_DEVICE_FAMILY: "1"

  NexusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - NexusWidgets
    info:
      path: NexusWidgets/Info.plist
      properties:
        CFBundleDisplayName: NexusWidgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.nexus.widgets

schemes:
  Nexus:
    build:
      targets:
        Nexus: all
        NexusWidgets: all
    run:
      config: Debug
